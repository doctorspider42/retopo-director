      <path d="M560 160L600 120L640 160L680 120L720 160L760 120L800 160M560 80L600 120L640 80L680 120L720 80L760 120L800 80M560 80V160M640 80V160M720 80V160M800 80V160"/>
      <path d="M560 240L600 200L640 240L680 200L720 240L760 200L800 240M560 160L600 200L640 160L680 200L720 160L760 200L800 160M600 120V200M680 120V200M760 120V200"/>
      <path d="M560 320L600 280L640 320L680 280L720 320L760 280L800 320M560 240L600 280L640 240L680 280L720 240L760 280L800 240M560 240V320M640 240V320M720 240V320M800 240V320M600 280V360M680 280V360M760 280V360"/>
    </g>
    <g stroke="#717EFF" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <path d="M800 0L920 90L800 180L920 270L800 360M920 90L1060 0M920 90L1060 200L920 270L1060 360M1060 0L1280 120L1060 200L1280 300L1060 360M920 90L800 180M800 0V360"/>
    </g>
    <g fill="#717EFF">
      <path d="M920 90L1060 0L1060 200z" fill-opacity="0.10"/>
      <path d="M1060 200L1280 120L1280 300z" fill-opacity="0.16"/>
      <path d="M920 270L1060 200L1060 360z" fill-opacity="0.06"/>
    </g>
    <rect width="1280" height="360" fill="url(#fade)"/>

    <!-- the mark -->
    <g transform="translate(72 84) scale(1.5)">
      <rect width="64" height="64" rx="15" fill="#717EFF"/>
      <path d="M32 12L49 22 32 30z" fill="#FFFFFF" fill-opacity="0.55"/>
      <path d="M15 22L32 12 32 30z" fill="#FFFFFF" fill-opacity="0.85"/>
      <path d="M15 22L32 30 15 42z" fill="#FFFFFF" fill-opacity="0.35"/>
      <path d="M49 22L49 42 32 30z" fill="#FFFFFF" fill-opacity="0.2"/>
      <path d="M15 42L32 30 32 52z" fill="#FFFFFF" fill-opacity="0.15"/>
      <path d="M32 12L49 22 49 42 32 52 15 42 15 22z M32 12V30 M15 22L32 30 49 22 M15 42L32 30 49 42 M32 30V52" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <g font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="236" fill="#ECEEF3" font-size="52" font-weight="700" letter-spacing="-1.2">PS2 Retopo Director</text>
      <text x="74" y="280" fill="#9AA1AE" font-size="22">High poly in. Console-budget low poly out.</text>
      <text x="74" y="314" fill="#717EFF" font-size="16" font-weight="600" letter-spacing="1.5">DETERMINISTIC GEOMETRY  ·  A LANGUAGE MODEL AS ART DIRECTOR</text>
