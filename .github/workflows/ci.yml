name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build that ships: MinGW, static, the same preset build.cmd uses. The
  # runner has no GPU, so the pipeline runs with --no-gpu; the silhouette metric
  # is checked by tools/bench.py on a machine that has one.
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            zip
      # A build that becomes a release carries the run number, which is what
      # the release tag says too; the copy compares the two to find updates.
      # Everything else is 0, a local build that never offers to update.
      - name: configure
        run: >-
          cmake --preset mingw-release -DRD_WARNINGS_AS_ERRORS=OFF
          -DRD_BUILD_NUMBER=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_number || 0 }}
      - name: build
        run: cmake --build --preset mingw-release
      - name: test
        run: ctest --preset mingw-release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-bench-runs
          path: build/mingw-release/ctest-bench/runs/*/run.log
      # What an artist downloads: the static executable, the profiles it reads
      # at start, the SAM sidecar, the licence. Only built for main, where it
      # becomes a release once every job is green.
      - name: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(sed -n 's/^project(RetopoDirector VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="PS2-Retopo-Director-${version}-build.${GITHUB_RUN_NUMBER}-windows-x64"
          mkdir -p dist/stage/tools
          cp build/mingw-release/bin/retopo-director.exe dist/stage/
          cp -r build/mingw-release/bin/profiles dist/stage/
          cp tools/sam_server.py dist/stage/tools/
          cp LICENSE README.md dist/stage/
          cp -r dist/stage "dist/${name}"
          (cd dist && zip -qr "${name}.zip" "${name}")
          echo "${version}" > dist/version.txt
      # The installer the update check downloads. Inno Setup 7 from its own
      # GitHub release, installed where the next step can find it.
      - name: installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\InnoSetup7' -Wait
          $iscc = Get-ChildItem -Path 'C:\InnoSetup7' -Filter 'ISCC.exe' -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup 7' }
          $version = (Get-Content dist\version.txt).Trim()
          & $iscc.FullName "/DAppVersion=$version" "/DBuildNumber=$env:GITHUB_RUN_NUMBER" "/DStageDir=$PWD\dist\stage" "/DOutputDir=$PWD\dist" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/version.txt
          retention-days: 7

  # The engine under the sanitizers. GLFW is built with its null platform, so no
  # X11 is needed; the window never opens, and neither the tests nor a --no-gpu
  # headless run needs it to.
  linux-sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev python3-numpy
      # The runner kernel randomises mmap with more bits than TSan's shadow
      # layout tolerates ("unexpected memory mapping"); 28 is what it expects.
      - name: tsan mmap entropy
        if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: configure
        run: cmake --preset ${{ matrix.preset }}
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.preset }}-runs
          path: build/${{ matrix.preset }}/ctest-bench/runs/*/run.log

  # Every green push to main is a release: the Windows installer and zip,
  # tagged with the project version and the run number, notes generated from
  # the merged PRs. The running application finds its updates here.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-mingw, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat dist/version.txt)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" dist/*-setup.exe dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PS2 Retopo Director ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            --latest
